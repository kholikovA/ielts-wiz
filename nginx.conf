server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hashed CRA bundles never change: cache for a year.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (index.html, standalone test pages, media) revalidates,
  # matching the old vercel.json header.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # Real files first (e.g. /tests/test_1.html), then the SPA shell for app routes.
    try_files $uri $uri/ $uri.html /index.html;
  }
}
