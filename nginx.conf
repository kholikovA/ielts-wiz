# www is the canonical host (as it was on Vercel): sessions live in per-origin
# localStorage, so the apex must redirect rather than serve a second copy.
server {
  listen 80;
  server_name ielts-wiz.com;
  return 301 https://www.ielts-wiz.com$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Hashed CRA bundles never change: cache for a year.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else (index.html, standalone test pages, media) revalidates,
  # matching the old vercel.json header.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    # Real files first (e.g. /tests/test_1.html), then a folder's own index.html
    # (the legal pages), then the SPA shell for app routes. A bare folder is not
    # tried: /reading and /listening are app routes that share their name with
    # the folders holding the standalone test pages.
    try_files $uri $uri/index.html $uri.html /index.html;
    # Same routes with a trailing slash would list the folder (403): serve the app.
    error_page 403 = /index.html;
  }
}
