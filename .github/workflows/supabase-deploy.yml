# On every merge to main: apply new SQL migrations, then deploy the edge
# functions whose code changed. Needs two repo secrets:
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   Project Settings → Database
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      all_functions:
        description: 'Deploy every edge function, not only changed ones'
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: jaucbfremtxmanciflab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Check migration file names
        run: |
          bad=$(ls supabase/migrations | grep -vE '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Migration files must be named YYYYMMDDHHMMSS_name.sql (UTC): $bad"
            exit 1
          fi
          dup=$(ls supabase/migrations | cut -c1-14 | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Two migrations share the version $dup"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Check migration history is in sync
        # Stops a fresh database history from re-running every old migration.
        run: |
          supabase migration list --password "$SUPABASE_DB_PASSWORD" | tee list.txt
          if [ "$(grep 20261110080808 list.txt | grep -o 20261110080808 | wc -l)" -lt 2 ]; then
            echo "::error::The database's migration history doesn't list 20261110080808_hub_chat as applied. Sync it before deploying."
            exit 1
          fi

      - name: Apply new migrations
        # --include-all also applies a migration older than the newest applied
        # one (a branch that was opened earlier but merged later).
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy changed edge functions
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            fns=$(git diff --name-only "$before" "$GITHUB_SHA" -- supabase/functions | cut -d/ -f3 | sort -u)
          elif [ "${{ inputs.all_functions }}" = "true" ]; then
            fns=$(ls supabase/functions)
          else
            fns=""
          fi
          for fn in $fns; do
            if [ -f "supabase/functions/$fn/index.ts" ]; then
              echo "Deploying $fn"
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            fi
          done
          [ -n "$fns" ] || echo "No edge function changes."
