# On every merge to main: apply new SQL migrations and sync edge functions on
# the self-hosted Supabase (api.ielts-wiz.com, Contabo VPS).
#
# The runner only sends a commit SHA over SSH. The deploy key is pinned on the
# server to one forced command (/usr/local/sbin/iw-supabase-deploy.sh), which
# fetches that commit from GitHub itself, checks it is on main, applies
# migrations not yet in supabase_migrations.schema_migrations, and rsyncs
# supabase/functions/* into the edge runtime. The key cannot open a shell.
#
# Repo secret: VPS_DEPLOY_KEY (private half of that deploy key).
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      all_functions:
        description: 'Restart the edge runtime even if no function changed'
        type: boolean
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 194.163.149.123
      # Pinned host key, so a spoofed server can't receive the deploy.
      VPS_HOST_KEY: 194.163.149.123 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9B5bZyf63i/xmO6hHiOTxjGwYWs7ZBnPCvNwh9f9RT
    steps:
      - uses: actions/checkout@v4

      - name: Check migration file names
        run: |
          bad=$(ls supabase/migrations | grep -vE '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Migration files must be named YYYYMMDDHHMMSS_name.sql (UTC): $bad"
            exit 1
          fi
          dup=$(ls supabase/migrations | cut -c1-14 | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Two migrations share the version $dup"
            exit 1
          fi

      - name: Deploy on the VPS
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$VPS_DEPLOY_KEY" ]; then
            echo "::error::Add the VPS_DEPLOY_KEY secret in Settings → Secrets → Actions."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          mode=""
          [ "${{ inputs.all_functions }}" = "true" ] && mode=" all"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            root@"$VPS_HOST" "${GITHUB_SHA}${mode}"
