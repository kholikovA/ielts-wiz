<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 480' width='860' height='480' font-family='Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif'><defs><marker id='ah' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#6366f1'/></marker></defs><rect width='860' height='480' rx='14' fill='#ffffff'/><text x='430' y='44' text-anchor='middle' font-size='20' font-weight='700' fill='#18181b'>Recycling plastic bottles</text><rect x='18' y='76' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='42' cy='100' r='13' fill='#4f46e5'/><text x='42' y='105' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>1</text><text x='64' y='105' font-size='14.5' font-weight='700' fill='#1e1b4b'>Collection</text><text x='32' y='138' font-size='13.5' fill='#3f3f46'>people put used</text><text x='32' y='157' font-size='13.5' fill='#3f3f46'>bottles in recycling</text><text x='32' y='176' font-size='13.5' fill='#3f3f46'>bins</text><rect x='234' y='76' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='258' cy='100' r='13' fill='#4f46e5'/><text x='258' y='105' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>2</text><text x='280' y='105' font-size='14.5' font-weight='700' fill='#1e1b4b'>Transport</text><text x='248' y='138' font-size='13.5' fill='#3f3f46'>trucks take the</text><text x='248' y='157' font-size='13.5' fill='#3f3f46'>bottles to a recycling</text><text x='248' y='176' font-size='13.5' fill='#3f3f46'>plant</text><rect x='450' y='76' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='474' cy='100' r='13' fill='#4f46e5'/><text x='474' y='105' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>3</text><text x='496' y='105' font-size='14.5' font-weight='700' fill='#1e1b4b'>Sorting</text><text x='464' y='138' font-size='13.5' fill='#3f3f46'>workers sort the</text><text x='464' y='157' font-size='13.5' fill='#3f3f46'>bottles by colour</text><rect x='666' y='76' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='690' cy='100' r='13' fill='#4f46e5'/><text x='690' y='105' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>4</text><text x='712' y='105' font-size='14.5' font-weight='700' fill='#1e1b4b'>Cleaning</text><text x='680' y='138' font-size='13.5' fill='#3f3f46'>machines remove the</text><text x='680' y='157' font-size='13.5' fill='#3f3f46'>labels and wash the</text><text x='680' y='176' font-size='13.5' fill='#3f3f46'>bottles</text><rect x='666' y='300' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='690' cy='324' r='13' fill='#4f46e5'/><text x='690' y='329' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>5</text><text x='712' y='329' font-size='14.5' font-weight='700' fill='#1e1b4b'>Shredding</text><text x='680' y='362' font-size='13.5' fill='#3f3f46'>a machine cuts the</text><text x='680' y='381' font-size='13.5' fill='#3f3f46'>clean plastic into</text><text x='680' y='400' font-size='13.5' fill='#3f3f46'>small flakes</text><rect x='450' y='300' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='474' cy='324' r='13' fill='#4f46e5'/><text x='474' y='329' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>6</text><text x='496' y='329' font-size='14.5' font-weight='700' fill='#1e1b4b'>Melting</text><text x='464' y='362' font-size='13.5' fill='#3f3f46'>the plant melts the</text><text x='464' y='381' font-size='13.5' fill='#3f3f46'>flakes and forms them</text><text x='464' y='400' font-size='13.5' fill='#3f3f46'>into pellets</text><rect x='234' y='300' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='258' cy='324' r='13' fill='#4f46e5'/><text x='258' y='329' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>7</text><text x='280' y='329' font-size='14.5' font-weight='700' fill='#1e1b4b'>Manufacturing</text><text x='248' y='362' font-size='13.5' fill='#3f3f46'>factories make the</text><text x='248' y='381' font-size='13.5' fill='#3f3f46'>pellets into clothing,</text><text x='248' y='400' font-size='13.5' fill='#3f3f46'>carpets and new</text><text x='248' y='419' font-size='13.5' fill='#3f3f46'>bottles</text><rect x='18' y='300' width='176' height='136' rx='12' fill='#eef2ff' stroke='#c7d2fe'/><circle cx='42' cy='324' r='13' fill='#4f46e5'/><text x='42' y='329' text-anchor='middle' font-size='13' font-weight='700' fill='#fff'>8</text><text x='64' y='329' font-size='14.5' font-weight='700' fill='#1e1b4b'>Sale</text><text x='32' y='362' font-size='13.5' fill='#3f3f46'>shops sell the new</text><text x='32' y='381' font-size='13.5' fill='#3f3f46'>products</text><path d='M198 144 L228 144' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M414 144 L444 144' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M630 144 L660 144' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M754 216 L754 294' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M662 368 L632 368' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M446 368 L416 368' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/><path d='M230 368 L200 368' stroke='#6366f1' stroke-width='2.5' fill='none' marker-end='url(#ah)'/></svg>