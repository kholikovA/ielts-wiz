<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to IELTS Wiz</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px system-ui, sans-serif; background: #fff; color: #333; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } }
</style>
</head>
<body>
<p>Returning to IELTS Wiz…</p>
<script>
// Telegram's login redirects here (the bot's domain is ielts-wiz.com) with the
// signed result in #tgAuthResult. Hand it to the IELTS Wiz page that started
// the login. Only our own hosts are accepted as the destination; the result is
// checked again server-side (telegram-auth edge function) before it is used.
(function () {
  var to = new URLSearchParams(location.search).get('to') || '';
  if (!/^https:\/\/(www\.|student\.)?ielts-wiz\.com(\/|$)/.test(to)) to = 'https://www.ielts-wiz.com/';
  to = to.split('#')[0];
  var m = /[#&]tgAuthResult=([^&]*)/.exec(location.hash);
  location.replace(to + '#tgAuthResult=' + (m ? m[1] : 'false'));
})();
</script>
</body>
</html>
